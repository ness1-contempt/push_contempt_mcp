[project]
name = "push_contempt_mcp"
version = "0.1.0"
description = "Server MCP in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "playwright>=1.64.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "requests>=2.32.0",
]

[project.scripts]
push_contempt_mcp = "push_contempt_mcp:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
